// Embed the existing Link implementation in the Dongfeng Open Headunit APK. Keep the standalone
// app build independent; both builds compile these same sources and use the same wire protocol.
plugins { id "com.android.library" }

android {
    namespace "com.softiva.oabllink.app"
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
    }
    sourceSets.main.java.srcDirs = ["../app/src/main/java"]
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(":bluetooth")
    implementation project(":core")
    implementation "org.json:json:20240303"
}
